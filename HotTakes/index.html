<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hot Takes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Matches the bottom of the canvas gradient in main.js, so safe-area
         insets and any overscroll flash blend in rather than showing black. */
      background: #0a0d14;
      /* Disable browser touch gestures (scroll, pinch, double-tap zoom) on the canvas. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      /* touch-action is NOT inherited, so setting it on body above does nothing for
         the canvas — and the canvas is where every touch actually lands. Without
         this the browser claims multi-finger gestures as a pinch and fires
         pointercancel on the in-flight drags, which breaks exactly the multitouch
         case the game depends on. */
      touch-action: none;
      -webkit-touch-callout: none;
    }
    /* Off-screen input: captures the soft keyboard on mobile. Never visually shown;
       all text is drawn on the canvas. Focused when the user taps an editable box. */
    #keyboard-capture {
      position: fixed;
      /* Kept INSIDE the viewport (under the canvas) — iOS scrolls to reveal a
         focused input, and an off-screen one shifts the whole page, which would
         invalidate the cached canvas rect and offset every touch coordinate. */
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      /* Not 0: some iOS versions decline to raise the keyboard for a fully
         transparent input. The canvas covers it either way. */
      opacity: 0.01;
      /* Must be >= 16px or iOS auto-zooms the viewport on focus. */
      font-size: 16px;
      border: 0;
      padding: 0;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <input id="keyboard-capture" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false">
  <script src="manual.js"></script>
  <script src="main.js"></script>
</body>
</html>
