<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Hot Takes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      /* Disable browser touch gestures (scroll, pinch, double-tap zoom) on the canvas. */
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Off-screen input: captures the soft keyboard on mobile. Never visually shown;
       all text is drawn on the canvas. Focused when the user taps an editable box. */
    #keyboard-capture {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: 0;
      padding: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <input id="keyboard-capture" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false">
  <script src="manual.js"></script>
  <script src="main.js"></script>
</body>
</html>
